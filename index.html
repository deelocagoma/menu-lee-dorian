<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#5E7057">
    <title>LEET-DORIAN</title>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(registration => {
                    if (registration.active && registration.active.scriptURL.includes('/sw.js')) {
                        registration.unregister().then(() => window.location.reload());
                    }
                });
            });
        }
    </script>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    <meta name="apple-mobile-web-app-title" content="LEET-DORIAN">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="pwaInstallBanner" class="pwa-banner" style="display: none;">
        <div class="pwa-info">
            <span class="pwa-title">LEET-DORIAN</span>
            <span class="pwa-desc">Installer l'application sur votre écran d'accueil</span>
        </div>
        <button id="pwaInstallBtn" class="pwa-btn">Installer</button>
        <button id="pwaCloseBtn" class="pwa-close">✕</button>
    </div>

    <header class="app-header">
        <div class="header-top">
            <div class="header-brand" id="headerBrand">
                <img src="assets/logo.svg" alt="LEET-DORIAN" class="header-logo" id="headerLogo">
                <div class="header-title">
                    <h1 id="headerTitle">LEET-DORIAN</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <a href="admin/" class="icon-btn admin-link" aria-label="Administration">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </a>
            </div>
        </div>

        <div class="header-toolbar" id="headerToolbar">
            <div class="header-tool-group">
                <span class="header-tool-label">LOGO</span>
                <button class="header-tool-btn" id="logoLeftBtn" aria-label="Gauche">←</button>
                <button class="header-tool-btn" id="logoRightBtn" aria-label="Droite">→</button>
                <button class="header-tool-btn" id="logoUpBtn" aria-label="Haut">↑</button>
                <button class="header-tool-btn" id="logoDownBtn" aria-label="Bas">↓</button>
            </div>
            <div class="header-tool-separator"></div>
            <div class="header-tool-group">
                <span class="header-tool-label">TITRE</span>
                <button class="header-tool-btn" id="titleLeftBtn" aria-label="Gauche">←</button>
                <button class="header-tool-btn" id="titleRightBtn" aria-label="Droite">→</button>
                <button class="header-tool-btn" id="titleUpBtn" aria-label="Haut">↑</button>
                <button class="header-tool-btn" id="titleDownBtn" aria-label="Bas">↓</button>
            </div>
            <div class="header-tool-separator"></div>
            <div class="header-tool-group">
                <span class="header-tool-label">POLICE</span>
                <select class="header-tool-select" id="titleFontSelect">
                    <option value="'Playfair Display', serif">Playfair</option>
                    <option value="'Lato', sans-serif">Lato</option>
                    <option value="'Georgia', serif">Georgia</option>
                    <option value="'Arial', sans-serif">Arial</option>
                </select>
            </div>
            <div class="header-tool-separator"></div>
            <div class="header-tool-group">
                <span class="header-tool-label">TAILLE</span>
                <button class="header-tool-btn" id="titleBigBtn" aria-label="Agrandir">T+</button>
                <button class="header-tool-btn" id="titleSmallBtn" aria-label="Réduire">T−</button>
            </div>
            <div class="header-tool-separator"></div>
            <div class="header-tool-group">
                <span class="header-tool-label">POS</span>
                <span class="header-tool-value" id="headerToolCoords">0,0</span>
            </div>
        </div>
    </header>
        
        <div class="search-bar" id="searchBar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Rechercher...">
            <button class="search-close" id="searchClose" aria-label="Fermer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-content" id="appContent">
        <div class="loading" id="loading">
            <div class="skeleton-loader" id="skeletonLoader">
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="hero" id="heroSection" style="display: none;">
            <p class="hero-subtitle">Menu & boissons</p>
        </section>

        <div class="categories-scroll" id="categoriesScroll"></div>

        <section class="menu-section" id="menuSection"></section>
    </main>

    <button class="fab" id="scrollTopBtn" aria-label="Retour en haut">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"></path>
        </svg>
    </button>

    <button class="selection-fab" id="selectionFab" style="display: none;" aria-label="Ma selection">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="selection-fab-count" id="selectionCount">0</span>
    </button>

    <div class="modal" id="selectionModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ma selection</h3>
                <button class="close-btn" onclick="closeSelectionModal()">&times;</button>
            </div>
            <div class="modal-body" id="selectionBody"></div>
            <div class="modal-footer">
                <div class="selection-total" id="selectionTotal"></div>
                <button class="clear-selection-btn" onclick="clearSelection()">Vider</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>

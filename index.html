<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#5E7057">
    <title>LEET-DORIAN</title>
    
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/logo-resto-leet-dorian.png">
    <meta name="apple-mobile-web-app-title" content="LEET-DORIAN">

    <style>
        #cartFab { opacity: 0 !important; pointer-events: none !important; }
        #cartPanel { display: none !important; }
        .loading-screen { position: fixed; inset: 0; background: #F6F4EE; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s ease; }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
    <link rel="preload" href="css/style.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/style.css"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body><div class="loading-screen" id="loadingScreen"><div class="loading-spinner" style="width:32px;height:32px;border:3px solid #ddd;border-top-color:#5E7057;border-radius:50%;animation:spin 0.8s linear infinite"></div></div>
    <div id="pwaInstallBanner" class="pwa-banner" style="display: none;">
        <div class="pwa-info">
            <span class="pwa-title">LEET-DORIAN</span>
            <span class="pwa-desc">Installer l'application sur votre écran d'accueil</span>
        </div>
        <button id="pwaInstallBtn" class="pwa-btn">Installer</button>
        <button id="pwaCloseBtn" class="pwa-close">✕</button>
    </div>

    <header class="app-header">
        <div class="header-top">
            <div class="header-brand" id="headerBrand">
                <img src="assets/logo.svg" alt="LEET-DORIAN" class="header-logo" id="headerLogo">
                <div class="header-title">
                    <h1 id="headerTitle">LEET-DORIAN</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <a href="admin/" class="icon-btn admin-link" aria-label="Administration">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </a>
            </div>
        </div>
    </header>
        
        <div class="search-bar" id="searchBar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Rechercher...">
            <button class="search-close" id="searchClose" aria-label="Fermer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-content" id="appContent">
        <div class="loading" id="loading">
            <div class="skeleton-loader" id="skeletonLoader">
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="hero" id="heroSection" style="display: none;">
            <p class="hero-subtitle">Menu & boissons</p>
        </section>

        <div class="categories-scroll" id="categoriesScroll"></div>

        <section class="menu-section" id="menuSection"></section>

        <section class="restaurant-card" id="restaurantCard" style="display: none;">
            <div class="restaurant-card-inner">
                <div class="restaurant-card-row" id="restaurantAddressRow" style="display: none;">
                    
                    <span class="restaurant-card-text" id="restaurantAddressText"></span>
                </div>
                <div class="restaurant-card-row" id="restaurantPhoneRow" style="display: none;">
                    
                    <a class="restaurant-card-text restaurant-card-link" id="restaurantPhoneLink" href="tel:"></a>
                </div>
                <div class="restaurant-card-row" id="restaurantHoursRow" style="display: none;">
                    
                    <span class="restaurant-card-text" id="restaurantHoursText"></span>
                </div>
            </div>
        </section>
    </main>

    <div class="cart-panel" id="cartPanel">
        <div class="cart-panel-header">
            <h3>Ma selection</h3>
            <button class="cart-close-btn" onclick="closeCartPanel()">&times;</button>
        </div>
        <div class="cart-panel-body" id="cartPanelBody"></div>
        <div class="cart-panel-footer">
            <div class="cart-total" id="cartTotal"></div>
            <button class="cart-clear-btn" onclick="clearSelection()">Vider</button>
        </div>
    </div>

    <div class="cart-fab" id="cartFab" aria-label="Ouvrir le panier">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-fab-count" id="cartCount">0</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
<script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(registration => {
                    if (registration.active && registration.active.scriptURL.includes('/sw.js')) {
                        registration.unregister().then(() => window.location.reload());
                    }
                });
            });
        }
    </script>
</body>

</html>

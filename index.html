<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#5E7057">
    <title>LEET-DORIAN</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    <meta name="apple-mobile-web-app-title" content="LEET-DORIAN">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="pwaInstallBanner" class="pwa-banner" style="display: none;">
        <div class="pwa-info">
            <span class="pwa-title">LEET-DORIAN</span>
            <span class="pwa-desc">Installer l'application sur votre écran d'accueil</span>
        </div>
        <button id="pwaInstallBtn" class="pwa-btn">Installer</button>
        <button id="pwaCloseBtn" class="pwa-close">✕</button>
    </div>

    <header class="app-header">
        <div class="header-top">
            <div class="header-brand" id="headerBrand">
                <img src="assets/logo.svg" alt="LEET-DORIAN" class="header-logo" id="headerLogo">
                <div class="header-title">
                    <h1>LEET-DORIAN</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <a href="admin/" class="icon-btn admin-link" aria-label="Administration">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </a>
            </div>
        </div>
        
        <div class="search-bar" id="searchBar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Rechercher...">
            <button class="search-close" id="searchClose" aria-label="Fermer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-content" id="appContent">
        <div class="loading" id="loading">
            <div class="skeleton-loader" id="skeletonLoader">
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line medium"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="hero" id="heroSection" style="display: none;">
            <p class="hero-subtitle">Menu & boissons</p>
        </section>

        <div class="categories-scroll" id="categoriesScroll"></div>

        <section class="menu-section" id="menuSection"></section>

        <section class="restaurant-info" id="restaurantInfo" style="display: none;">
            <div class="restaurant-info-inner">
                <h2 class="restaurant-info-name" id="restaurantInfoName"></h2>
                <div class="restaurant-info-items">
                    <div class="restaurant-info-item" id="restaurantInfoAddress" style="display: none;">
                        <svg class="restaurant-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-right:6px;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span class="restaurant-info-text"></span>
                    </div>
                    <div class="restaurant-info-item" id="restaurantInfoPhone" style="display: none;">
                        <svg class="restaurant-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-right:6px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
                        <a class="restaurant-info-text restaurant-info-link" href="tel:"></a>
                    </div>
                    <div class="restaurant-info-item" id="restaurantInfoWhatsapp" style="display: none;">
                        <svg class="restaurant-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-right:6px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        <a class="restaurant-info-text restaurant-info-link" href="https://wa.me/" target="_blank" rel="noopener"></a>
                    </div>
                    <div class="restaurant-info-item" id="restaurantInfoHours" style="display: none;">
                        <svg class="restaurant-info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-right:6px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span class="restaurant-info-text"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <button class="fab" id="scrollTopBtn" aria-label="Retour en haut">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"></path>
        </svg>
    </button>

    <button class="selection-fab" id="selectionFab" style="display: none;" aria-label="Ma selection">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="selection-fab-count" id="selectionCount">0</span>
    </button>

    <div class="modal" id="selectionModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ma selection</h3>
                <button class="close-btn" onclick="closeSelectionModal()">&times;</button>
            </div>
            <div class="modal-body" id="selectionBody"></div>
            <div class="modal-footer">
                <div class="selection-total" id="selectionTotal"></div>
                <button class="clear-selection-btn" onclick="clearSelection()">Vider</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0C0C0C">
    <title>Admin - LEET-DORIAN</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <img src="../assets/logo.svg" alt="LEET-DORIAN" class="login-logo">
            <h1 class="login-title">Administration</h1>
            <p class="login-subtitle">LEET-DORIAN</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="error-message" id="errorMessage" style="display: none;">
                    Mot de passe incorrect
                </div>
                
                <button type="submit" class="login-btn">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'Pilipili#2030';
        
        if (sessionStorage.getItem('pilipili_admin')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('pilipili_admin', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>

    <script>
        (function() {
            const logo = document.querySelector('.login-logo');
            if (!logo) return;

            const stateKey = 'leet-dorian-login-logo-state';

            function parseTranslate(el) {
                const m = (el.style.transform || '').match(/translate\(([^p]+)px,\s*([^p]+)px\)/);
                return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 0, y: 0 };
            }

            function applyTranslate(el, x, y) {
                el.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
            }

            function applyState(state) {
                applyTranslate(logo, state.x || 0, state.y || 0);
                logo.style.height = state.height || '120px';
            }

            const saved = localStorage.getItem(stateKey);
            if (saved) {
                try { applyState(JSON.parse(saved)); } catch (e) {}
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E7057">
    <title>Admin - LEET-DORIAN</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script src="../js/mobile-check.js"></script>
    <script>
        if (!sessionStorage.getItem('pilipili_admin')) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="admin-header">
        <div class="admin-header-content">
            <img src="../assets/logo.svg" alt="LEET-DORIAN" class="admin-logo">
            <h1>Administration</h1>
            <button class="icon-btn admin-logout" onclick="logout()" aria-label="Déconnexion" title="Déconnexion">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="admin-toast" id="adminToast">Enregistrement réussi</div>

    <main class="admin-main">

        <!-- Galerie de l'Hôtel -->
        <section class="admin-section" id="gallerySection" style="display: none;">
            <div class="section-header">
                <h2>Diaporama de l'Hôtel</h2>
                <button class="add-btn" onclick="adminApp.openSlideModal()" style="background: var(--sage); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600;">+ Ajouter</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px;">Ces images défilent en haut de l'application.</p>
            <div id="galleryEditorList" class="items-list">
                <!-- Editeur d'images du diaporama -->
            </div>
        </section>

        <!-- Chambres -->
        <section class="admin-section" id="itemsSection">
            <div class="section-header">
                <h2>Chambres</h2>
                <button class="add-btn" onclick="showItemForm(null, 'chambre')">+ Ajouter</button>
            </div>

            <div class="settings-group">
                <label class="settings-label">Affichage des plats</label>
                <div class="display-options">
                    <button class="display-option" data-display="grid" onclick="adminApp.setDisplayMode('grid')">
                        <div class="display-icon">
                            <div class="grid-preview">
                                <span></span><span></span><span></span><span></span>
                            </div>
                        </div>
                        <span>Grille</span>
                    </button>
                    <button class="display-option active" data-display="list" onclick="adminApp.setDisplayMode('list')">
                        <div class="display-icon">
                            <div class="list-preview">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                        <span>Liste</span>
                    </button>
                </div>
            </div>

            <div class="items-list" id="itemsList"></div>
            <div class="section-loading" style="display:none;align-items:center;justify-content:center;padding:40px 0;">
                <div class="loading-spinner" style="width:28px;height:28px;border:3px solid #eee;border-top-color:#5E7057;border-radius:50%;animation:spin 0.8s linear infinite"></div>
            </div>
        </section>

        <!-- Petits-déjeuners -->
        <section class="admin-section" id="foodSection" style="display: none;">
            <div class="section-header">
                <h2>Petits-déjeuners</h2>
                <button class="add-btn" onclick="showItemForm(null, 'petit_dejeuner')">+ Ajouter</button>
            </div>

            <div class="settings-group">
                <label class="settings-label">Affichage des petits-déjeuners</label>
                <div class="display-options">
                    <button class="display-option" data-display="grid" onclick="adminApp.setDisplayMode('grid')">
                        <div class="display-icon">
                            <div class="grid-preview">
                                <span></span><span></span><span></span><span></span>
                            </div>
                        </div>
                        <span>Grille</span>
                    </button>
                    <button class="display-option active" data-display="list" onclick="adminApp.setDisplayMode('list')">
                        <div class="display-icon">
                            <div class="list-preview">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                        <span>Liste</span>
                    </button>
                </div>
            </div>

            <div class="items-list" id="foodList"></div>
            <div class="section-loading" style="display:none;align-items:center;justify-content:center;padding:40px 0;">
                <div class="loading-spinner" style="width:28px;height:28px;border:3px solid #eee;border-top-color:#5E7057;border-radius:50%;animation:spin 0.8s linear infinite"></div>
            </div>
        </section>





        <!-- Restaurant -->
        <!-- Infos Hôtel -->
        <section class="admin-section" id="restaurantSection" style="display: none;">
            <div class="section-header">
                <h2>Infos Hôtel</h2>
            </div>

            <form id="restaurantForm" class="admin-form">
                <div class="form-group">
                    <label for="restaurantName">Nom</label>
                    <input type="text" id="restaurantName">
                </div>
                <div class="form-group">
                    <label for="hotelSlogan">Slogan court (sous les étoiles)</label>
                    <input type="text" id="hotelSlogan" placeholder="Ex: L'incontournable du centre-ville...">
                </div>
                <div class="form-group">
                    <label for="hotelWelcomeText">Texte de présentation (bouton "Découvrir l'hôtel")</label>
                    <textarea id="hotelWelcomeText" rows="3" placeholder="Ex: 26 ans d'expérience répondra à vos exigences..."></textarea>
                </div>
                <div class="form-group">
                    <label for="restaurantAddress">Adresse</label>
                    <input type="text" id="restaurantAddress">
                </div>
                <div class="form-group">
                    <label for="restaurantPhone">Téléphone</label>
                    <input type="tel" id="restaurantPhone">
                </div>
                <div class="form-group">
                    <label for="restaurantHours">Horaires</label>
                    <input type="text" id="restaurantHours" placeholder="Lun-Dim: 12h-23h">
                </div>
                <h3 class="form-subtitle">Réseaux Sociaux</h3>
                <div class="form-group">
                    <label for="facebook">Facebook</label>
                    <input type="url" id="facebook" placeholder="https://facebook.com/...">
                </div>
                <div class="form-group">
                    <label for="instagram">Instagram</label>
                    <input type="url" id="instagram" placeholder="https://instagram.com/...">
                </div>
                <div class="form-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="Ex: 241074412256">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="restaurantInfoVisible" checked>
                    <label for="restaurantInfoVisible">Afficher les informations sur le menu public</label>
                </div>


            <button type="submit" class="save-btn">Enregistrer</button>
        </form>
    </section>

</main>

    <!-- Navigation inférieure -->
        <nav class="admin-bottom-nav">
        <button class="admin-nav-item active" data-section="items">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 4v16"></path>
                <path d="M2 8h18a2 2 0 0 1 2 2v10"></path>
                <path d="M2 17h20"></path>
                <path d="M6 8v9"></path>
            </svg>
            <span>Chambres</span>
        </button>
        <button class="admin-nav-item" data-section="food">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
                <path d="M7 2v20"></path>
                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
            </svg>
            <span>Petits-déjeuners</span>
        </button>

        <button class="admin-nav-item" data-section="restaurant">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Infos Hôtel</span>
        </button>
    
        <button class="admin-nav-item" data-section="gallery">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Diaporama</span>
        </button>
    </nav>

    <!-- Modal Plat -->
    <div class="modal" id="itemModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="itemModalTitle">Ajouter une chambre</h3>
                <button class="close-btn" onclick="closeItemModal()">&times;</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <input type="hidden" id="itemType">
                
                <div class="photo-upload">
                    <label class="photo-upload-label" id="photoUploadLabel">Photo de la chambre</label>
                    <div class="photo-upload-area">
                        <div class="photo-preview" id="photoPreview" onclick="document.getElementById('photoFile').click()">
                            <span class="photo-preview-placeholder">Ajouter</span>
                        </div>
                        <div class="photo-url-input" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
                            <div>
                                <input type="file" id="photoFile" accept="image/*" class="photo-upload-input" onchange="handlePhotoUpload(event)" style="margin-bottom: 4px;">
                                <small style="color: var(--text-muted); font-size: 0.7rem;">(Bouton Uploader : ImgBB)</small>
                            </div>
                            
                            <div style="margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px;">
                                <label for="itemImageUrl" style="font-size:0.75rem; color:var(--text-secondary); margin-bottom:4px; display:block;">Ou collez directement une URL (ex: imgur) :</label>
                                <input type="url" id="itemImageUrl" placeholder="https://..." oninput="if(this.value){ adminApp.photoData = this.value; document.getElementById('photoPreview').innerHTML = '<img src=\'' + this.value + '\' style=\'width:100%;height:100%;object-fit:cover;border-radius:12px;\'>'; }" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--bg-primary); font-size:0.8rem; color:var(--text-primary);">
                            </div>
                        </div>
                    </div>
                </div>
                

                <div class="form-group" style="margin-top: 16px; padding: 12px; background: var(--bg-primary); border-radius: 8px; border: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="font-size: 0.9rem; font-weight: 600; margin: 0;">Autres pièces de la chambre (Douche, Salon...)</label>
                        <button type="button" onclick="adminApp.addItemGalleryPiece()" style="background: var(--sage); color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer;">+ Ajouter une pièce</button>
                    </div>
                    <div id="itemGalleryPiecesList" style="display: flex; flex-direction: column; gap: 8px;">
                        <!-- Pieces added dynamically -->
                    </div>
                </div>
                <div class="form-group">
                    <label for="itemName">Nom</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group" id="itemDescriptionGroup">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemPrice">Prix (FCFA)</label>
                        <input type="number" id="itemPrice" min="0" required>
                    </div>

                </div>


                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeItemModal()">Annuler</button>
                    <button type="submit" class="save-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>



    <!-- Modal Confirmation -->
    <div class="modal" id="confirmModal" style="display: none;">
        <div class="modal-content modal-small">
            <h3 id="confirmTitle">Confirmer</h3>
            <p id="confirmMessage" style="color: var(--text-secondary); margin: 16px 0;">Êtes-vous sûr ?</p>
            <div class="form-actions">
                <button class="cancel-btn" onclick="closeConfirmModal()">Annuler</button>
                <button class="delete-btn" id="confirmBtn">Supprimer</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin.js?v=11"></script>
    <script>
        const CONFIG = {
            masterKey: '$2a$10$q94z0iyNLwf.aYQIH.DWvu0rTWEIbvKOl4Wl/Ufoe/Ugu21V2EcPC',
            binId: '6a91f15cf5f4af5e294f4dc1'
        };


    </script>

    
    </div>


    <!-- Modal Diaporama -->
    <div class="modal" id="slideModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="slideModalTitle">Ajouter une image</h3>
                <button class="close-btn" onclick="adminApp.closeSlideModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <input type="hidden" id="slideIndex" value="-1">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px;">Titre de l'image</label>
                    <input type="text" id="slideTitle" placeholder="Ex: Façade arrière" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px;">URL de l'image</label>
                    <input type="url" id="slideUrl" placeholder="https://..." style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: monospace;">
                </div>
            </div>
            <div class="modal-footer" style="padding: 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px;">
                <button class="cancel-btn" onclick="adminApp.closeSlideModal()" style="padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer;">Annuler</button>
                <button class="save-btn" onclick="adminApp.saveSlide()" style="padding: 8px 16px; border: none; border-radius: 6px; background: var(--sage); color: white; font-weight: 600; cursor: pointer;">Enregistrer</button>
            </div>
        </div>
    </div>

</body>
</html>
